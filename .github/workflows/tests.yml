name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  # Плашка release показывает последний опубликованный релиз — пересобираем её, когда список релизов меняется.
  release:
    types: [published, edited, unpublished, deleted]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Плашки в README (<!-- badges:start --> … <!-- badges:end -->) обновляются только в основной ветке:
  # в pull request'ах и других ветках коммит бота дал бы конфликты в README при слиянии.
  # Событие release приходит с тегом в github.ref_name, поэтому и checkout, и push идут в основную ветку явно.
  badges:
    name: Update README badges
    if: >-
      github.event_name == 'release' ||
      (github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: readme-badges
      cancel-in-progress: false
    env:
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # badges.js пишет README и при упавших тестах (плашка станет «failing»), но выходит с кодом 1.
      # Запоминаем код, чтобы сначала закоммитить плашки, а потом уронить job.
      - name: Run test suites and regenerate badges
        id: badges
        env:
          GITHUB_TOKEN: ${{ github.token }} # версия релиза для плашки берётся из GitHub API
        run: |
          set +e
          npm run badges
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit README if badges changed
        run: |
          if git diff --quiet -- README.md; then
            echo "Плашки не изменились."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Обновить плашки в README [skip ci]"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Fail if tests failed
        if: steps.badges.outputs.exit_code != '0'
        run: |
          echo "::error::Тесты упали — плашки в README помечены как failing."
          exit 1
